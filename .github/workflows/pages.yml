name: Deploy public VSTOPIA Team Tree
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public-only assets and strictly allowlisted GitHub summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = (Path('index.html'), Path('app.js'), Path('style.css'), Path('ez-tree-scene.js'), Path('liquid-glass.css'), Path('scene-polish.css'), Path('ground-blend.js'), Path('apple-glass.css'), Path('shrub-garden.js'), Path('water-environment.js'), Path('garden-wildlife.js'), Path('water-garden.css'), Path('team-readable.css'), Path('vendor/addons/Water.js'), Path('glass-react-source/glass-island.jsx'), Path('glass-react-source/specy-header.jsx'))
          for p in assets:
              text=p.read_text()
              for forbidden in ('VSTOPIA-Council', 'AUDIOENCE-World', 'OstinDesktopCommander',
                                'gho_', 'ghp_', 'github_pat_', 'GITHUB_TOKEN', '/api/overview'):
                  assert forbidden not in text, f'Private source string in {p}'
          calibration=json.loads(Path('assets/calibration/ground-grade.json').read_text())
          required_calibration={'schema_version','description','sampling_region','photo_ground_srgb',
                               'render_ground_srgb','linear_rgb_grade','spatial_grade_left',
                               'spatial_grade_right','spatial_grade_strength','display_roundtrip_samples','note'}
          assert set(calibration)==required_calibration
          assert calibration['schema_version']==1
          assert len(calibration['photo_ground_srgb'])>=4
          for field in ('linear_rgb_grade','spatial_grade_left','spatial_grade_right'):
              assert len(calibration[field])==3
              assert all(type(value) in (float,int) and 0.1<=value<=1.4 for value in calibration[field])
          for forbidden in ('github_pat_', 'gho_', 'private_repo_name', 'repository_url'):
              assert forbidden not in json.dumps(calibration)
          assert Path('vendor/vstopia-liquid-glass-island.mjs').stat().st_size > 80000
          assert Path('vendor/vstopia-specy-header.mjs').stat().st_size > 150000
          assert Path('vendor/legal/specy-liquid-glass-MIT.txt').is_file()
          assert not Path('glass-react-source/node_modules').exists()
          assert 'id="viewList"' not in Path('index.html').read_text()
          assert 'id="listDrawer"' not in Path('index.html').read_text()
          # Conceptual public nodes are not private repo names or invented per-repo activity.
          app=Path('app.js').read_text()
          assert 'AREA TEMATICA' in app
          assert 'DEMO' not in app
          assert 'ESEMPIO DI ATTIVITÀ' not in app
          assert 'Create a new animation' not in app
          assert 'const repos = names.map' in app
          assert 'commits: [' not in app
          assert 'last_commit:' not in app
          snapshot=json.loads(Path('snapshot.json').read_text())
          allowed={'schema_version','data_policy','scope','updated_at',
                   'repository_count','default_branch_commits','open_issues',
                   'open_pull_requests','merged_pull_requests_all_time',
                   'people','push_count_policy','personal_counts_policy','workload_policy'}
          assert set(snapshot)==allowed, f'Unexpected public snapshot field: {set(snapshot)-allowed}'
          assert snapshot['schema_version']==2
          assert snapshot['data_policy']=='public-authorized-team-summary'
          assert type(snapshot['people']) is list and len(snapshot['people'])==2
          valid_people={'ostinsolo','InnovateSN'}
          fields={'name','github','commits','prs_opened_all_time','prs_merged_all_time',
                  'push_events_observed_30d','last_interaction_at','last_interaction_type',
                  'event_coverage_partial','assigned_open_issues','assigned_open_prs','reviews_requested'}
          assert {p['github'] for p in snapshot['people']}==valid_people
          for p in snapshot['people']:
              assert set(p)==fields
              for k in fields-{'name','github','last_interaction_at','last_interaction_type','event_coverage_partial'}:
                  assert type(p[k]) is int and p[k]>=0
              assert p['name'] in ('Marcello','Agostino')
          payload=json.dumps(snapshot)
          for forbidden in ('VSTOPIA-Council','AUDIOENCE-World','OstinDesktopCommander',
                            'gho_','ghp_','github_pat_','private_repo_name','repository_url'):
              assert forbidden not in payload
          print('PASS: only preapproved aggregate totals and two collaborator profiles')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
